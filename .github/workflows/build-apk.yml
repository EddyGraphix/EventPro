name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build APK
        run: dotnet publish -f net10.0-android -c Release -p:WarningLevel=0

      - name: Locate APK
        run: |
          $apk = Get-ChildItem -Recurse -Filter *.apk | Select-Object -First 1
          echo "APK_PATH=$($apk.FullName)" >> $env:GITHUB_ENV
          echo "APK_NAME=$($apk.Name)" >> $env:GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          body: |
            Auto-built APK from commit ${{ github.sha }}
          files: ${{ env.APK_PATH }}
